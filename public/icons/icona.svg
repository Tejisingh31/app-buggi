<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo di Buggi: "b" geometrica con la spunta "pagato", su viola. Sorgente dei PNG delle icone (vedi README). -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="luce" cx="0.2" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sfondo)"/>
  <rect width="512" height="512" fill="url(#luce)"/>
  <!-- disegno -->
  <g transform="translate(-10 0)">
    <!-- la "b": asta e pancia rotonda, tratto spesso con estremità arrotondate -->
    <g fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round">
      <path d="M178 104V330"/>
      <circle cx="268" cy="330" r="90"/>
    </g>
    <!-- spunta "pagato" dentro la pancia -->
    <path d="m236 334 22 22 42-46" fill="none" stroke="url(#oro)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
