<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo di Buggi: una "B" con la moneta "pagato". Sorgente dei PNG delle icone (vedi README). -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <mask id="lettera">
      <rect width="512" height="512" fill="#000"/>
      <!-- la B: asta con due pance arrotondate -->
      <path fill="#fff" d="M136 104h146a76 76 0 0 1 0 152H136Z"/>
      <path fill="#fff" d="M136 232h162a86 86 0 0 1 0 172H136Z"/>
      <!-- i due buchi -->
      <path fill="#000" d="M196 156h80a24 24 0 0 1 0 48h-80Z"/>
      <path fill="#000" d="M196 284h96a34 34 0 0 1 0 68h-96Z"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sfondo)"/>
  <!-- disegno -->
  <g transform="translate(-22 -8)">
    <rect width="512" height="512" fill="#ffffff" mask="url(#lettera)"/>
    <!-- moneta con la spunta "pagato" -->
    <circle cx="374" cy="366" r="70" fill="#0f766e"/>
    <circle cx="374" cy="366" r="58" fill="#fbbf24"/>
    <circle cx="374" cy="366" r="58" fill="none" stroke="#f59e0b" stroke-width="8"/>
    <path d="m346 367 20 20 38-42" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
